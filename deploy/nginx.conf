server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;

  # Duplicados de propósito. Em produção o Caddy na frente já injeta estes cabeçalhos, mas quem
  # alcançar esta porta direto (rede interna, port-forward, ou um dia sem o Caddy) receberia a
  # aplicação sem proteção nenhuma — e a falta não aparece em teste, só num incidente.
  # O hash de script-src acompanha o <script> inline de index.html: use `npm run csp:hash`.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-oE4Kg4n7TtACoc6A3k0Po1UGbOzPabV/EugI3MC3myU='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    # `add_header` num location descarta os herdados do server: repetir é obrigatório, não redundante.
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-oE4Kg4n7TtACoc6A3k0Po1UGbOzPabV/EugI3MC3myU='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }
}
