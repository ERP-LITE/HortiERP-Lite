services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hortierp_test
      POSTGRES_PASSWORD: hortierp_test
      POSTGRES_DB: hortierp_test
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hortierp_test -d hortierp_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
