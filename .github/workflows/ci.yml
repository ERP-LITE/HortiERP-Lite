name: CI

on:
  push:
  pull_request:

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hortierp_test
          POSTGRES_PASSWORD: hortierp_test
          POSTGRES_DB: hortierp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hortierp_test -d hortierp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://hortierp_test:hortierp_test@127.0.0.1:5432/hortierp_test
      APP_DATABASE_URL: postgres://hortierp_app:hortierp_app@127.0.0.1:5432/hortierp_test
      NODE_ENV: test
      JWT_SECRET: integration-test-secret-with-at-least-32-characters

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build API
        run: npm run build:api

      - name: Build web
        run: npm run build:web

      - name: Apply test migrations
        run: npm run db:migrate

      - name: Run integration tests
        run: npm run test:run --workspace=apps/api

      - name: Run web unit tests
        run: npm test --workspace=apps/web

      - name: Check CSP script hash
        run: npm run csp:hash

      - name: Check tenant scope on database queries
        run: npm run check:tenant-scope

      - name: Check privacy notice date matches its text
        run: npm run check:privacy-date

  deploy-production:
    name: Deploy to Oracle Cloud
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY_BASE64: ${{ secrets.ORACLE_SSH_PRIVATE_KEY_BASE64 }}
          SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY_BASE64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Validate SSH connection
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: ssh -o BatchMode=yes "$ORACLE_USER@$ORACLE_HOST" true

      - name: Synchronize application files
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh "$ORACLE_USER@$ORACLE_HOST" 'mkdir -p /home/ubuntu/ERP-LITE'
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='.env.production' \
            --exclude='apps/api/.env' \
            --exclude='apps/web/.env' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            --exclude='tests/load/results/' \
            -e ssh ./ "$ORACLE_USER@$ORACLE_HOST:/home/ubuntu/ERP-LITE/"

      - name: Deploy production
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh "$ORACLE_USER@$ORACLE_HOST" \
            "cd /home/ubuntu/ERP-LITE && IMAGE_TAG='$IMAGE_TAG' sh deploy/deploy.sh"
