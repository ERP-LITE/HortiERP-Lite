<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HortiERP Lite</title>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script>
      (function () {
        var stored = localStorage.getItem('hortierp_theme')
        var isDark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', isDark)
      })()
    </script>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      .app-bootstrap-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f9fafb;
        color: #111827;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .dark .app-bootstrap-loader {
        background: #030712;
        color: #f3f4f6;
      }

      .app-bootstrap-loader__content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }

      .app-bootstrap-loader__mark {
        display: grid;
        width: 48px;
        height: 48px;
        place-items: center;
        border-radius: 14px;
        background: #16a34a;
        color: white;
        font-size: 25px;
        font-weight: 800;
        box-shadow: 0 10px 24px rgb(22 163 74 / 22%);
      }

      .app-bootstrap-loader__spinner {
        width: 24px;
        height: 24px;
        border: 3px solid #d1d5db;
        border-top-color: #16a34a;
        border-radius: 9999px;
        animation: app-bootstrap-spin 0.75s linear infinite;
      }

      .dark .app-bootstrap-loader__spinner {
        border-color: #374151;
        border-top-color: #4ade80;
      }

      .app-bootstrap-loader__label {
        margin: 0;
        color: #6b7280;
        font-size: 13px;
      }

      .dark .app-bootstrap-loader__label {
        color: #9ca3af;
      }

      @keyframes app-bootstrap-spin {
        to { transform: rotate(360deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-bootstrap-loader__spinner { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="app-bootstrap-loader" role="status" aria-live="polite" aria-label="Carregando HortiERP Lite">
        <div class="app-bootstrap-loader__content">
          <div class="app-bootstrap-loader__mark" aria-hidden="true">H</div>
          <div class="app-bootstrap-loader__spinner" aria-hidden="true"></div>
          <p class="app-bootstrap-loader__label">Preparando seu ambiente...</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
