services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB}
    volumes:
      - postgres_production_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  migrate:
    image: hortierp-api:${IMAGE_TAG:-latest}
    environment: &api_environment
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGIN: https://${APP_DOMAIN:?Defina APP_DOMAIN}
      TRUST_PROXY: "true"
      INVOICE_STORAGE_PATH: /app/storage/invoices
      INVOICE_MAX_FILE_SIZE: ${INVOICE_MAX_FILE_SIZE:-10485760}
      TECHNICAL_LOG_RETENTION_DAYS: ${TECHNICAL_LOG_RETENTION_DAYS:-180}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-1825}
    command: ["node", "dist/db/migrate.js"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  api:
    image: hortierp-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    restart: unless-stopped
    environment: *api_environment
    volumes:
      - invoice_files:/app/storage/invoices
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - backend
      - frontend

  retention:
    image: hortierp-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment: *api_environment
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # O `trap` é obrigatório, não zelo: este shell roda como PID 1, e PID 1 ignora sinal que
        # não tenha tratador instalado. Sem ele o `compose down` esperava os 10s de carência e
        # matava o container à força — medido. Com o trap, para em 0,25s.
        trap 'exit 0' TERM INT
        while true; do
          node dist/scripts/retentionPurge.js || echo "[retencao] falhou; nova tentativa em ${RETENTION_INTERVAL_SECONDS:-604800}s" >&2
          # `sleep &` + `wait` em vez de `sleep` direto: só assim o sinal interrompe a espera.
          sleep ${RETENTION_INTERVAL_SECONDS:-604800} &
          wait $$!
        done
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - backend

  web:
    image: hortierp-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: production
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend

  gateway:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Defina APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - frontend

  backup:
    build:
      context: .
      dockerfile: deploy/backup/Dockerfile
    image: hortierp-backup:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment: &backup_environment
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:?Defina POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:?Defina POSTGRES_DB}
      BACKUP_ENCRYPTION_PASSWORD: ${BACKUP_ENCRYPTION_PASSWORD:?Defina BACKUP_ENCRYPTION_PASSWORD}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_REMOTE_PATH: ${BACKUP_REMOTE_PATH:-}
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
      RCLONE_CONFIG_STORAGE_TYPE: ${RCLONE_CONFIG_STORAGE_TYPE:-}
      RCLONE_CONFIG_STORAGE_PROVIDER: ${RCLONE_CONFIG_STORAGE_PROVIDER:-}
      RCLONE_CONFIG_STORAGE_ACCESS_KEY_ID: ${RCLONE_CONFIG_STORAGE_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_STORAGE_SECRET_ACCESS_KEY: ${RCLONE_CONFIG_STORAGE_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_STORAGE_ENDPOINT: ${RCLONE_CONFIG_STORAGE_ENDPOINT:-}
      RCLONE_CONFIG_STORAGE_ACL: private
      # A chave de aplicação é restrita a um único bucket, então o rclone não
      # consegue confirmar que ele existe e tenta criá-lo antes de enviar — o
      # que a chave não permite (403 AccessDenied: not entitled). O bucket é
      # criado à mão na configuração inicial, então essa verificação é
      # dispensável.
      RCLONE_CONFIG_STORAGE_NO_CHECK_BUCKET: "true"
    volumes:
      - backup_data:/backups
      - invoice_files:/invoice-files:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "test -f /backups/.last-success && find /backups/.last-success -mmin -2880 | grep -q ."]
      # O deploy aguarda no máximo 180 s; a primeira verificação precisa ocorrer
      # dentro dessa janela. O comando é local e barato, então 1 min é suficiente.
      interval: 1m
      timeout: 5s
      start_period: 2m
      retries: 3
    networks:
      - backend
      # A rede backend é internal, ou seja, não tem rota para fora. O envio do
      # backup para o storage remoto precisa de saída para a internet, então o
      # container entra também na egress — que existe só para isso e não é
      # compartilhada com o banco nem com a API.
      - egress

  restore-check:
    image: hortierp-backup:${IMAGE_TAG:-latest}
    profiles: ["maintenance"]
    environment:
      <<: *backup_environment
      RESTORE_TEST_DATABASE: hortierp_restore_test
    command: ["/usr/local/bin/restore-test.sh"]
    volumes:
      - backup_data:/backups:ro
      - invoice_files:/invoice-files:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

volumes:
  postgres_production_data:
  caddy_data:
  caddy_config:
  backup_data:
  invoice_files:

networks:
  backend:
    internal: true
  frontend:
  # Saída para a internet, usada só pelo backup para enviar os arquivos ao
  # storage remoto. Fica separada da frontend para o backup não dividir rede
  # com o gateway e o site.
  egress:
